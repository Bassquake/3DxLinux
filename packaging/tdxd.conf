# /etc/tdxd.conf - reload with: systemctl reload tdxd   (SIGHUP)

# ---- outputs ----------------------------------------------------------
uinput = yes                    # virtual evdev device "3Dconnexion <name> (tdxd)"
spnav  = yes                    # spacenavd-compatible socket (libspnav apps: Blender, FreeCAD, ...)
spnav_socket = /run/spnav.sock  # do not run spacenavd at the same time
control_socket = /run/tdxd.sock # for tdxctl and tdx-focus
lcd_cfg = /run/tdxd/LCDCfg.xml  # button texts for the LCD applets (Function Keys); none = off

# ---- per-application profiles (3DxWare's per-app settings) ------------
# Each /etc/tdxd.d/<name>.conf is layered on top of this file while a matching
# application is focused ("match = blender, blender-*"; default: the file name).
# The focused app comes from tdx-focus (X11 / sway), else from the newest
# spacenavd client. See blender.conf.example. `tdxctl profiles` lists them.
profile_dir = /etc/tdxd.d

# ---- calibration (3DxWare's "Calibrate" button) -----------------------
# Re-zeroes the cap's rest position in the device firmware (HID feature report
# 0x07). Run `tdxctl calibrate` with the cap untouched, or bind it to a button.
# calibrate_on_start = no
# calibrate_button = V3DK_MENU

# ---- motion (3DxWare "Speed" / "Advanced Settings") --------------------
sensitivity = 1.0
deadzone    = 2                 # raw units (device range is roughly +-350)
dominant    = no                # only pass the strongest axis
disable_translation = no
disable_rotation    = no
# Per-axis scale / invert / remap. Axes: tx ty tz rx ry rz (raw HID order).
# scale_tz = 0.5        # per-axis speed; 0 switches the axis off ("Active")
# invert_ry = yes       # "Reverse"
# Many libspnav applications expect Y up / Z toward the user; if motion looks
# swapped, try:
# map_ty = tz
# map_tz = ty
# map_ry = rz
# map_rz = ry

# ---- buttons -> keys --------------------------------------------------
# key_<V3DK id or BUTTON_n> = KEY [+ KEY ...]  (evdev names, KEY_ prefix optional)
#   KEY + KEY   a chord, held while the button is held  (KEY_LEFTCTRL + KEY_C)
#   KEY, KEY    a sequence, tapped in turn on press     (KEY_V, KEY_F)
# The keys come from a separate "(tdxd keys)" keyboard device.
# "none" removes a binding (useful in a per-application profile).
# /etc/tdxd.d/freecad.conf binds the view keys to FreeCAD's shortcuts.
# Unmapped buttons are sent as BTN_0.. / BTN_TRIGGER_HAPPYn and spnav button events.
# SpacePilot Pro ids: V3DK_MENU FIT TOP LEFT RIGHT FRONT BOTTOM BACK ROLL_CW ROLL_CCW
#   ISO1 ISO2 1..10 ESC ALT SHIFT CTRL ROTATE PANZOOM DOMINANT PLUS MINUS
key_V3DK_ESC   = KEY_ESC
key_V3DK_ALT   = KEY_LEFTALT
key_V3DK_SHIFT = KEY_LEFTSHIFT
key_V3DK_CTRL  = KEY_LEFTCTRL

# ---- buttons -> driver actions (3DxWare's built-in button functions) ---
# action_<V3DK id or BUTTON_n> = speed_up | speed_down | dominant | rotation |
#                                panzoom | calibrate | lcd_next | none
# A button with an action is handled by tdxd and not sent to applications.
# Toggles and speed changes last until the next reload or profile switch;
# `tdxctl status` shows the current state. 3DxWare's SpacePilot Pro defaults:
action_V3DK_PLUS     = speed_up
action_V3DK_MINUS    = speed_down
action_V3DK_DOMINANT = dominant
action_V3DK_ROTATE   = rotation
action_V3DK_PANZOOM  = panzoom

# ---- LED (HID output report 0x04; omit to leave as is) ----------------
# led = yes
# RGB LEDs (Giotto only; HID feature report 0x1A). Colours are RRGGBB.
# led_button_color = FFFFFF          # all button LEDs
# led_ring_color   = 0080FF          # the 6 ring segments
# led_color_V3DK_FIT = FF8000        # one button, by its V3DK id
# led_color_LED_30   = FF0000        # or by raw LED index (0-29 buttons, 30-35 ring)

# ---- LCD (SpacePilot Pro 320x240, SpaceMouse Enterprise 640x150, Giotto 1280x416)
lcd = yes
lcd_brightness = 80             # 0..100, omit to keep the device setting (SpacePilot Pro + Enterprise)
# lcd_image = /etc/tdxd/splash.ppm   # binary PPM sized for the panel, instead of the key page
# lcd_swap_rb = yes                  # Enterprise / Giotto: if red and blue look swapped
lcd_label_1 = Fit
lcd_label_2 = Top
lcd_label_3 = Front
lcd_label_4 = Right
lcd_label_5 = Iso
lcd_label_6 = Undo
lcd_label_7 = Redo
lcd_label_8 = Save
lcd_label_9 = Copy
lcd_label_10 = Paste
lcd_label_11 = Key 11           # 11 and 12: SpaceMouse Enterprise and Giotto
lcd_label_12 = Key 12
# lcd_label_<V3DK id> = text names any key on the LCD (Function Keys), e.g. a view
# key a profile binds to an application's shortcut: lcd_label_V3DK_TOP = Top View
# Giotto: labels 13..48 add slide pages (12 keys each, up to 4 pages); a button
# slides to the next page with the Windows slide animation.
# lcd_label_13 = Measure
# lcd_slide_button = V3DK_MENU
# lcd_slide_step = 80                # pixels per 25 ms step
# Giotto legacy path: send DIR/sp4LCD.bmp (24 bpp) whenever it is written, then
# delete it, like 3DxWare; DIR/sp4LCDControl.txt may hold "(x, y), (w, h)".
# lcd_bmp_dir = /run/tdxd
