# FreeCAD: the SpacePilot's view keys send FreeCAD's own keyboard shortcuts while
# FreeCAD has the focus. (3DxWare passes these keys to FreeCAD, which on Windows
# handles them itself; on Linux FreeCAD gets only numbered spacenav buttons and
# does nothing with them until you assign commands in its Spaceball settings.)
# Layered on /etc/tdxd.conf; the focused application comes from tdx-focus.
match = freecad*

# FreeCAD's default shortcuts (Tools > Customize > Keyboard). The number keys
# are the characters 0-6, so they need a layout whose top row types digits.
key_V3DK_ISO1     = KEY_0                      # Isometric
key_V3DK_FRONT    = KEY_1                      # Front
key_V3DK_TOP      = KEY_2                      # Top
key_V3DK_RIGHT    = KEY_3                      # Right
key_V3DK_BACK     = KEY_4                      # Rear
key_V3DK_BOTTOM   = KEY_5                      # Bottom
key_V3DK_LEFT     = KEY_6                      # Left
key_V3DK_ROLL_CW  = KEY_LEFTSHIFT + KEY_RIGHT  # Rotate view clockwise
key_V3DK_ROLL_CCW = KEY_LEFTSHIFT + KEY_LEFT   # Rotate view counter-clockwise
key_V3DK_FIT      = KEY_V, KEY_F               # Fit all (V, then F)

# the names on the LCD (Function Keys) instead of the keys sent
lcd_label_V3DK_ISO1     = ISO
lcd_label_V3DK_FRONT    = Front View
lcd_label_V3DK_TOP      = Top View
lcd_label_V3DK_RIGHT    = Right View
lcd_label_V3DK_BACK     = Back View
lcd_label_V3DK_BOTTOM   = Bottom View
lcd_label_V3DK_LEFT     = Left View
lcd_label_V3DK_ROLL_CW  = Roll +
lcd_label_V3DK_ROLL_CCW = Roll -
lcd_label_V3DK_FIT      = Fit All
